name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, vet, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go vet (integration tests)
        run: go vet -tags=integration ./...
      - name: go build
        run: go build ./...
      - name: go test (race detector)
        run: go test -race -count=1 ./...

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gameapi
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: gameapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gameapi -d gameapi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://gameapi:ci-only-password@localhost:5432/gameapi_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test -tags=integration
        run: go test -count=1 -tags=integration ./Persistence/...

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -t gameapi:ci .

  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: redocly lint
        run: npx --yes @redocly/cli@2.71.0 lint docs/openapi.yaml
